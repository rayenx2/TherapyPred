<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bgTherapyPred" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accTherapyPred" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
    <filter id="glowTherapyPred" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="gridTherapyPred" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <radialGradient id="rgTherapyPred" cx="85%" cy="50%" r="40%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#0a0f1e;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bgTherapyPred)"/>
  <rect width="1280" height="320" fill="url(#gridTherapyPred)" opacity="0.4"/>
  <rect width="1280" height="320" fill="url(#rgTherapyPred)"/>
  <rect x="0" y="0" width="1280" height="2" fill="url(#accTherapyPred)" opacity="0.7"/>
  <rect x="0" y="0" width="4" height="320" fill="url(#accTherapyPred)"/>

  <g transform="translate(64, 112)" filter="url(#glowTherapyPred)">
    <rect width="96" height="96" rx="16" fill="#6366f1" opacity="0.85"/>
    <path d="M22 48h16l12-36 12 72 12-36h16" transform="translate(0,0)" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="184" y="158" font-family="'Inter', 'Segoe UI', Arial, sans-serif"
        font-size="62" font-weight="700" fill="#f1f5f9" letter-spacing="-2">
    Therapy<tspan fill="url(#accTherapyPred)">Pred</tspan>
  </text>

  <text x="186" y="198" font-family="'Inter', 'Segoe UI', Arial, sans-serif"
        font-size="17" font-weight="400" fill="#64748b" letter-spacing="0.2">
    Clinical treatment recommendation ML pipeline  ·  MLflow tracking  ·  Prometheus + Grafana
  </text>

  <line x1="184" y1="218" x2="820" y2="218" stroke="#1e293b" stroke-width="1"/>

  <g transform="translate(184, 236)">
    <rect width="118" height="34" rx="6" fill="#0f172a" stroke="#1e3a5f" stroke-width="1"/>
    <text x="59" y="13" font-family="'Inter', 'Segoe UI', Arial, sans-serif"
          font-size="9" fill="#475569" text-anchor="middle" letter-spacing="1" font-weight="600">TREATMENT</text>
    <text x="59" y="27" font-family="'Inter', 'Segoe UI', Arial, sans-serif"
          font-size="11" fill="#818cf8" text-anchor="middle" font-weight="600">recommendation</text>
  </g>
  <g transform="translate(314, 236)">
    <rect width="118" height="34" rx="6" fill="#0f172a" stroke="#1e3a5f" stroke-width="1"/>
    <text x="59" y="13" font-family="'Inter', 'Segoe UI', Arial, sans-serif"
          font-size="9" fill="#475569" text-anchor="middle" letter-spacing="1" font-weight="600">MLFLOW</text>
    <text x="59" y="27" font-family="'Inter', 'Segoe UI', Arial, sans-serif"
          font-size="11" fill="#818cf8" text-anchor="middle" font-weight="600">tracked</text>
  </g>
  <g transform="translate(444, 236)">
